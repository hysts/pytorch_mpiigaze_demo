[project]
name = "ptgaze"
version = "0.2.9"
description = "Gaze estimation using MPIIGaze and MPIIFaceGaze"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "hysts" }]
urls = { Homepage = "https://github.com/hysts/pytorch_mpiigaze_demo" }
license = { file = "LICENSE" }
dependencies = [
    "dlib>=19.24.8",
    "face-alignment>=1.4.1",
    "huggingface-hub>=0.30.0",
    "mediapipe>=0.10.21",
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "opencv-python>=4.11.0.86",
    "pyyaml>=6.0.2",
    "safetensors>=0.5.3",
    "scipy>=1.15.2",
    "timm>=1.0.15",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[project.scripts]
ptgaze = "ptgaze.main:main"
ptgaze-convert = "ptgaze.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["ptgaze"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # missing-trailing-comma
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "E501",   # line-too-long
    "SIM117", # multiple-with-statements
    #
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method
    "D107",    # undocumented-public-init
    "EM101",   # raw-string-in-exception
    "FBT001",  # boolean-type-hint-positional-argument
    "FBT002",  # boolean-default-value-positional-argument
    "PGH003",  # blanket-type-ignore
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "TRY003",  # raise-vanilla-args
]
unfixable = [
    "F401", # unused-import
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201", "T203"]
"__init__.py" = ["F401"]
"tests/**" = [
    "S101",    # assert-used (pytest tests rely on assert)
    "PLR2004", # magic-value-comparison
    "INP001",  # implicit-namespace-package (tests dir has no __init__.py)
]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.20",
]
